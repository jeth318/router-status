services:
  router-status:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      CONFIG_PATH: /app/config/config.yaml
    volumes:
      - ./config/config.yaml:/app/config/config.yaml:ro
      - subscriptions:/app/data
    ports:
      # Routern skickar syslog till VPS:ens IP på port 514/udp.
      - "514:5514/udp"
      # Webbsidan nås via Caddy (se README). Lokalt på VPS:en:
      - "127.0.0.1:8081:8080"
    labels:
      # Så att containern är lätt att hitta i Dozzle/Vector.
      app: router-status
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    # Om du vill använda forward.type=victorialogs, anslut till logging-nätverket:
    # networks: [default, logging]

# networks:
#   logging:
#     external: true
#     name: logging_default

volumes:
  subscriptions:
