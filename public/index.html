<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<title>Router Status</title>
<style>
  body{font:16px system-ui;margin:0;padding:24px;max-width:480px;margin:auto;background:#fff;color:#111}
  button,input{font:inherit;padding:12px;width:100%;box-sizing:border-box;margin:6px 0;border-radius:8px;border:1px solid #888}
  button{background:#111;color:#fff;border:0}
  #msg{margin-top:12px;color:#555;min-height:1.5em}
  @media(prefers-color-scheme:dark){body{background:#111;color:#eee}input{background:#222;color:#eee}button{background:#eee;color:#111}}
</style>
</head>
<body>
<h1>Router Status</h1>
<p>Aktivera pushnotiser för routerlarm på den här enheten. På iPhone: lägg först sidan på hemskärmen (Dela, Lägg till på hemskärmen) och öppna den därifrån.</p>
<input id="token" type="password" placeholder="Åtkomstkod" autocomplete="current-password">
<button id="on">Aktivera notiser</button>
<button id="test">Skicka testnotis</button>
<button id="off">Stäng av på den här enheten</button>
<div id="msg"></div>
<p id="env" style="font-size:12px;color:#888"></p>
<script>
const $ = (id) => document.getElementById(id);
const say = (t) => ($('msg').textContent = t);
document.getElementById('env').textContent = 'https: ' + window.isSecureContext + ' · standalone: ' + (navigator.standalone ?? matchMedia('(display-mode: standalone)').matches) + ' · push: ' + ('PushManager' in window);
try { $('token').value = localStorage.getItem('token') ?? ''; } catch {}
//.getItem('token') ?? '';
const auth = () => { try { localStorage.setItem('token', $('token').value); } catch {} return { 'Content-Type': 'application/json', 'X-Access-Token': $('token').value }; };
const b64 = (s) => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), (c) => c.charCodeAt(0));

async function reg() {
  if (!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('Push stöds inte här. På iPhone krävs hemskärmsappen.');
  return navigator.serviceWorker.register('/sw.js');
}
$('on').onclick = async () => {
  let step = 'start';
  try {
    step = 'kontroll av webbläsarstöd';
    if (!window.isSecureContext) throw new Error('sidan är inte https');
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) throw new Error('Push stöds inte här. På iPhone krävs hemskärmsappen.');
    step = 'notistillstånd'; // direkt vid knapptryck, annars nekar Safari
    if ((await Notification.requestPermission()) !== 'granted') return say('Notiser nekades i webbläsaren.');
    step = 'hämta sw.js';
    const swRes = await fetch('/sw.js');
    if (!swRes.ok) throw new Error('sw.js svarade ' + swRes.status + ', undanta /sw.js från basic_auth i Caddy');
    step = 'registrera service worker';
    await navigator.serviceWorker.register('/sw.js');
    const ready = await navigator.serviceWorker.ready;
    step = 'hämta VAPID-nyckel';
    const keyRes = await fetch('/api/vapid-key', { headers: auth() });
    if (!keyRes.ok) return say('Fel åtkomstkod eller för många försök.');
    const { publicKey } = await keyRes.json();
    if (!publicKey) throw new Error('servern saknar VAPID-nycklar');
    step = 'prenumerera hos push-tjänsten';
    const sub = await ready.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64(publicKey) });
    step = 'spara prenumeration';
    const res = await fetch('/api/subscribe', { method: 'POST', headers: auth(), body: JSON.stringify(sub) });
    say(res.ok ? 'Klart! Den här enheten får nu notiser.' : 'Fel: ' + (await res.text()));
  } catch (e) { say('Felade vid "' + step + '": ' + e.name + ': ' + e.message); }
};
$('test').onclick = async () => {
  const res = await fetch('/api/test', { method: 'POST', headers: auth() });
  say(res.ok ? 'Testnotis skickad.' : 'Fel: ' + (await res.text()));
};
$('off').onclick = async () => {
  try {
    const r = await navigator.serviceWorker.getRegistration();
    const sub = await r?.pushManager.getSubscription();
    if (sub) { await fetch('/api/unsubscribe', { method: 'POST', headers: auth(), body: JSON.stringify({ endpoint: sub.endpoint }) }); await sub.unsubscribe(); }
    say('Avstängt på den här enheten.');
  } catch (e) { say(e.message); }
};
</script>
</body>
</html>
