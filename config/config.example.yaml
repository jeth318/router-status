# Kopiera till config/config.yaml och anpassa.
# ${VAR} ersätts med miljövariabler (t.ex. från .env), ${VAR:-standard} med fallback.

listen:
  host: 0.0.0.0
  udpPort: 5514        # Docker mappar 514/udp -> 5514 (routern skickar till 514)
  tcpPort: null        # sätt t.ex. 5514 om något skickar syslog över TCP
  httpPort: 8080       # webbsida för att aktivera push + /health

# Push via Web Push (VAPID), samma teknik som cartripwatch. type: webpush | console
# Generera nycklar med: npm run vapid
notify:
  type: ${NOTIFY_TYPE:-webpush}
  webpush:
    publicKey: ${VAPID_PUBLIC_KEY}
    privateKey: ${VAPID_PRIVATE_KEY}
    subject: ${VAPID_SUBJECT:-mailto:jesper.thornberg@me.com}
    click: https://logs.jtdev.se   # trycker man på notisen öppnas loggen

# Varje loggrad skrivs som JSON till stdout. På VPS:en samlar Vector in
# containerloggar och skickar dem till VictoriaLogs, så hela routerloggen
# hamnar på logs.jtdev.se utan extra konfiguration.
stdout: true

# Valfritt: skicka dessutom varje rad direkt någonstans.
# type: none | victorialogs | syslog | loki | http
forward:
  type: ${FORWARD_TYPE:-none}
  victorialogs:
    url: ${VICTORIALOGS_URL:-http://victorialogs:9428}
  syslog:
    host: ${FORWARD_SYSLOG_HOST:-}
    port: ${FORWARD_SYSLOG_PORT:-514}
    protocol: udp      # udp | tcp
  loki:
    url: ${LOKI_URL:-}
    username: ${LOKI_USERNAME:-}
    password: ${LOKI_PASSWORD:-}
    labels:
      host: rt-ax58u
  http:
    url: ${FORWARD_HTTP_URL:-}

# Regelreferens:
#   match:    regex mot meddelandet; namngivna grupper (?<ip>...) kan användas i title/body som {ip}
#   exclude:  regex som stoppar matchning
#   program:  regex mot programnamnet (t.ex. dropbear, kernel, dnsmasq-dhcp)
#   severity: högsta nivå som matchar (emerg..debug), t.ex. warning = warning och allvarligare
#   priority: min | low | default | high | urgent
#   cooldown: sekunder innan samma regel får skicka igen (standard 60)
#   enabled:  false för att stänga av
# I title/body finns även {message}, {program}, {hostname}, {level}, {raw}.
# Dödmansvakt. Loggen färdas över internet till VPS:en, så när WAN går ner kommer INGA
# rader fram (UDP buffras inte). Tystnad är därför den enda signalen om att internet är nere.
# Huvudroutern loggar ett cron-jobb varje minut, så några minuters tystnad är onormalt.
watchdog:
  enabled: true
  host: '^RT-AX58U'          # regex mot hostname; tom = vilken källa som helst
  maxSilenceSeconds: 300

# Regler. Matchas mot "program: meddelande" (regex, skiftlägesokänsligt). Se kommentarerna ovan.
rules:
  # Kommer bara fram om routern har en reservlinje; annars hjälper dödmansvakten.
  - name: wan-nere
    match: 'WAN[ _]Connection:.*(disconnect|did not function|unplugged|lost)'
    title: 'Internet nere'
    body: '{message}'
    priority: urgent
    tags: [rotating_light]
    cooldown: 300

  # Loggas när internet kommit tillbaka (då kommer också de köade raderna igenom).
  - name: wan-uppe
    match: 'WAN[ _]Connection:.*restored'
    title: 'Internet tillbaka'
    body: 'WAN återställt på {hostname}'
    priority: default
    tags: [white_check_mark]
    cooldown: 120

  # Ny publik IP efter att WAN återansluts (inadyn uppdaterar DDNS).
  - name: ny-publik-ip
    program: '^inadyn$'
    match: 'Update forced for alias \S+, new IP# (?<ip>\S+)'
    title: 'Ny publik IP-adress'
    body: '{ip}'
    priority: low
    tags: [globe_with_meridians]
    cooldown: 60

  - name: misslyckad-inloggning
    match: '(abnormal logins?|login fail|Bad password attempt|authentication fail).*?(from (?<ip>[0-9a-fA-F.:]+))?'
    title: 'Misslyckad inloggning på routern'
    body: '{message}'
    priority: high
    tags: [warning, lock]
    cooldown: 120

  - name: lyckad-inloggning
    match: '(Successful login|Password auth succeeded|login success)'
    title: 'Någon loggade in på routern'
    priority: default
    tags: [key]
    cooldown: 30

  - name: omstart
    match: '(syslogd started|klogd started|Linux version \d)'
    title: 'Routern har startat om'
    priority: high
    tags: [arrows_counterclockwise]
    cooldown: 600

  - name: firmware
    match: 'firmware.*(upgrade|update|available)'
    title: 'Firmware-händelse'
    priority: default
    tags: [package]
    cooldown: 3600

  - name: aiprotection
    match: '(AiProtection|Hacker attack|Infected device|Malicious site|BWDPI.*block)'
    title: 'AiProtection larmade'
    priority: high
    tags: [shield]
    cooldown: 300

  # OBS: ASUS roamast loggar vanliga roaming-händelser som "emerg", därför undantas den.
  - name: allvarliga-fel
    severity: crit
    exclude: '^(roamast|hostapd|wlceventd|crond|dnsmasq-dhcp):'
    title: 'Kritiskt fel på {hostname} ({program})'
    priority: high
    tags: [boom]
    cooldown: 300
    match: '.'

  # Ny enhet fick IP via DHCP. Kan bli pratigt, därför avstängd som standard.
  - name: ny-dhcp-klient
    enabled: false
    program: '^dnsmasq-dhcp$'
    match: 'DHCPACK\(\w+\) (?<ip>\S+) (?<mac>\S+) ?(?<name>\S*)'
    title: 'Enhet anslöt: {name}'
    body: '{ip} ({mac})'
    priority: low
    cooldown: 0
